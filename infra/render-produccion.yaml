# Configuración activa del servicio multiempresa desde el 24 de noviembre de 2026.
# El procedimiento de traslado y reversión está en docs/desarrollo/cambio-dominio.md.
# Mantener autoSync desactivado y revisar el plan antes de aprobarlo.
# El nombre identifica el servicio existente; no crear otro servicio con este archivo.
# Las claves privadas, las bases y el almacenamiento se conservan en Render.
previews:
  generation: 'off'

services:
  - type: web
    name: smartstock-multiempresa-pruebas
    runtime: python
    repo: https://github.com/jadelgad0s/SmartStock-multiempresa
    branch: main
    region: ohio
    plan: free
    numInstances: 1
    autoDeployTrigger: 'off'
    buildCommand: bash scripts/build-render.sh
    startCommand: bash scripts/start-render.sh
    healthCheckPath: /salud/
    renderSubdomainPolicy: enabled
    domains:
      - smartstockchile.cl
      - "*.smartstockchile.cl"
    envVars:
      - key: SS_DOMINIO_EMPRESAS
        value: smartstockchile.cl
