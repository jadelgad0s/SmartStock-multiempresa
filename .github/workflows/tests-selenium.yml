name: Pruebas funcionales con Selenium

on:
  pull_request:
    paths: ['apps/**', 'config/**', 'esquema_multiempresa/**', 'static/**', 'templates/**', 'requirements-web.txt', '.github/workflows/tests-selenium.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selenium:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.7'
      - run: python -m pip install -r requirements-web.txt selenium==4.52.0
      - run: python manage.py test apps.core.selenium_suite --settings=config.settings.testing --verbosity 2 --noinput
      - name: Probar dos empresas en el mismo navegador
        if: ${{ !cancelled() }}
        run: python manage.py test esquema_multiempresa.selenium_suite --settings=esquema_multiempresa.testing --verbosity 2 --noinput
      - name: Guardar capturas del acceso unificado
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: acceso-unificado-capturas
          path: /tmp/ss-acceso-unificado-*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Guardar capturas de auditoría con datos de prueba
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-capturas
          path: /tmp/ss-auditoria-*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Guardar capturas de logos de empresas con datos de prueba
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: marcas-empresas-capturas
          path: /tmp/ss-empresa-*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Guardar capturas del registro de productos por empresa
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: catalogo-empresa-capturas
          path: /tmp/ss-catalogo-empresa-*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Guardar capturas del panel central con datos de prueba
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: panel-sistema-capturas
          path: /tmp/ss-panel-sistema-*.png
          if-no-files-found: ignore
          retention-days: 3
