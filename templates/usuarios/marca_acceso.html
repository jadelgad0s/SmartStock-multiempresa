{% load static %}
{% if request.empresa.logo_estatico %}
<a href="/" class="ss-auth-brand ss-company-brand" aria-label="{{ request.empresa.nombre }}, inicio de sesión">
  <img src="{% static request.empresa.logo_estatico %}" alt="Logo de {{ request.empresa.nombre }}" class="ss-company-logo" width="220" height="200" decoding="async">
</a>
{% else %}
<a href="/" class="ss-auth-brand" aria-label="SmartStock, inicio de sesión">
  <span class="ss-auth-brand-icon ss-login-brand-icon"><img src="{% static 'branding/smartstock-mark.png' %}" alt="" class="ss-brand-logo" width="32" height="32"></span>
  <span>SmartStock</span>
</a>
{% endif %}
