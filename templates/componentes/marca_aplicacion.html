{% load static %}
{% if request.empresa.logo_estatico %}
<a href="/" data-ss-inicio class="ss-company-brand ss-company-brand-menu" aria-label="Ir al inicio de {{ request.empresa.nombre }}">
  <img src="{% static request.empresa.logo_estatico %}" alt="Logo de {{ request.empresa.nombre }}" class="ss-company-logo" width="196" height="172" decoding="async">
</a>
{% else %}
<a href="/" data-ss-inicio aria-label="Ir al inicio de {% firstof request.empresa.nombre 'SmartStock' %}" class="d-flex align-items-center mb-4 text-decoration-none px-2 mt-2">
  <div class="bg-primary-soft rounded p-2 me-2 d-flex align-items-center justify-content-center" style="width: 36px; height: 36px;">
    <img src="{% static 'branding/smartstock-mark.png' %}" alt="Logo SmartStock" class="ss-brand-logo" width="28" height="28">
  </div>
  <span class="fs-5 fw-bold" style="color: #0f172a; letter-spacing: -0.02em;">{% firstof request.empresa.nombre 'SmartStock' %}</span>
</a>
{% endif %}
